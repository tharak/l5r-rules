<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <!-- Seamless mottling and fine fibers overlay the site's warm paper color. -->
  <defs>
    <filter id="mottling" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues=".30 .90"/>
        <feFuncG type="table" tableValues=".19 .79"/>
        <feFuncB type="table" tableValues=".07 .60"/>
      </feComponentTransfer>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="384" height="384" filter="url(#mottling)" opacity=".22"/>
  <rect width="384" height="384" filter="url(#grain)" opacity=".16"/>
</svg>
